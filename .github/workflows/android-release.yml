name: Android Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Tests and lint
        run: bash gradlew testDebugUnitTest lintDebug --no-daemon --no-configuration-cache
      - name: Android integration and interface tests
        run: bash gradlew pixel2api30DebugAndroidTest --no-daemon --no-configuration-cache -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: test-reports
          path: |
            app/build/reports/
            app/build/outputs/managed_device_android_test_additional_output/
          retention-days: 14

  release:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Read release version
        run: |
          echo "VERSION_CODE=$(sed -n 's/^versionCode=//p' version.properties)" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$(sed -n 's/^versionName=//p' version.properties)" >> "$GITHUB_ENV"
      - name: Build signed release
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?Missing signing secret}"
          export RELEASE_STORE_FILE="$RUNNER_TEMP/release.p12"
          trap 'rm -f "$RELEASE_STORE_FILE"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RELEASE_STORE_FILE"
          bash gradlew assembleRelease --no-daemon --no-configuration-cache
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
      - name: Prepare release files
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk "release/GiroCerto-$VERSION_NAME.apk"
          cd release
          sha256sum "GiroCerto-$VERSION_NAME.apk" > SHA256SUMS.txt
          python3 - <<'PY'
          import hashlib, json, os
          filename = 'GiroCerto-' + os.environ['VERSION_NAME'] + '.apk'
          digest = hashlib.sha256(open(filename, 'rb').read()).hexdigest()
          tag = 'v' + os.environ['VERSION_NAME']
          json.dump({'versionCode': int(os.environ['VERSION_CODE']), 'versionName': os.environ['VERSION_NAME'],
                     'sha256': digest, 'apkUrl': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{tag}/{filename}"},
                    open('update.json', 'w'), indent=2)
          PY
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$VERSION_NAME"
          gh release create "$tag" "release/GiroCerto-$VERSION_NAME.apk" release/SHA256SUMS.txt release/update.json \
            --verify-tag=false --target "$GITHUB_SHA" --title "Giro Certo $VERSION_NAME" \
            --notes-file "analysis/RELEASE_${VERSION_NAME//./_}.md" --latest
